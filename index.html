<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Problem 2 - Button Styling</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <p class="eyebrow">Carlo T. Feria · BSIT-4C</p>
        <h1>Problem 2: Button Styling</h1>
        <p>Three button sets based on the supplied CSS reference. Hover, focus, and press each button to inspect its states.</p>
      </header>

      <section class="example style-1" aria-labelledby="style-1-title">
        <div class="example-heading">
          <h2 id="style-1-title">Style 1</h2>
          <p>Blue primary button</p>
        </div>
        <div class="button-row">
          <button class="btn_clickMe" type="button">Click Me</button>
        </div>
      </section>

      <section class="example style-2" aria-labelledby="style-2-title">
        <div class="example-heading">
          <h2 id="style-2-title">Style 2</h2>
          <p>Blue and white buttons</p>
        </div>
        <div class="button-row">
          <button class="btn_clickMe" type="button">Click Me</button>
          <button class="btn_clickHere" type="button">Click Here</button>
        </div>
      </section>

      <section class="example style-3" aria-labelledby="style-3-title">
        <div class="example-heading">
          <h2 id="style-3-title">Style 3</h2>
          <p>Blue, white, and soft gray buttons</p>
        </div>
        <div class="button-row">
          <button class="btn_clickMe" type="button">Click Me</button>
          <button class="btn_clickHere" type="button">Click Here</button>
          <button class="btn_clickThis" type="button">Click This</button>
        </div>
      </section>
    </main>
  </body>
</html>
